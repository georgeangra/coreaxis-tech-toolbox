name: Site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4

      - name: Validar links internos e hashes publicados
        run: |
          set -e
          for f in site/*.html; do
            grep -q "<title>" "$f" || { echo "Sem <title>: $f"; exit 1; }
          done
          python3 -c "import json; d=json.load(open('site/hashes.json')); assert d['latest'] in [r['version'] for r in d['releases']]; print('hashes.json OK:', d['latest'])"

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
